name: Build & Release WebPhotoCropper

on:
  push:
    branches: [ "master", "main" ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: WebPhotoCropper-Windows
            installer_file: dist/Setup_WebPhotoCropper.exe
            portable_file: dist/WebPhotoCropper-Windows-Portable.zip
          - os: ubuntu-latest
            artifact_name: WebPhotoCropper-Linux
            installer_file: dist/Setup_WebPhotoCropper-Linux
            portable_file: dist/WebPhotoCropper-Linux-Portable.tar.gz

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Linux System Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb1 libxcb-xinerama0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-shape0 libxcb-xfixes0 libxkbcommon-x11-0 libsm6 libice6 libglib2.0-0t64 libfontconfig1 || true

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller opencv-python pillow-heif qrcode PyQt6

      - name: Build Standalone Executable & Setup Installer
        run: |
          python build_all.py

      - name: Package Windows Artifacts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path dist/WebPhotoCropper -DestinationPath dist/WebPhotoCropper-Windows-Portable.zip -Force

      - name: Package Linux Artifacts
        if: runner.os == 'Linux'
        run: |
          cp dist/Setup_WebPhotoCropper dist/Setup_WebPhotoCropper-Linux
          tar -czvf dist/WebPhotoCropper-Linux-Portable.tar.gz -C dist WebPhotoCropper

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            ${{ matrix.installer_file }}
            ${{ matrix.portable_file }}

      - name: Create / Update GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.installer_file }}
            ${{ matrix.portable_file }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
