<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 260px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0d1117;
      color: #c9d1d9;
      margin: 0;
      padding: 16px;
    }
    h3 {
      margin: 0 0 8px 0;
      color: #58a6ff;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .status-badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: bold;
      background: #238636;
      color: #ffffff;
      margin-bottom: 12px;
    }
    p {
      font-size: 12px;
      line-height: 1.4;
      color: #8b949e;
      margin: 0 0 12px 0;
    }
  </style>
</head>
<body>
  <h3>✂️ Qt6 Photo Cropper</h3>
  <div class="status-badge" id="status">🟢 Plugin Active</div>
  <p>Click any picture on any web page in Microsoft Edge to automatically crop & save it in the desktop app.</p>
  <div style="font-size: 11px; color: #58a6ff; border-top: 1px solid #30363d; padding-top: 8px;">Created by Corey Kiesel</div>
</body>
</html>
