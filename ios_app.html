<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="PhotoCropper">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="app_icon.ico">
    <title>Web Photo Cropper - iPhone iOS App</title>
    <style>
        :root {
            --ios-bg: #000000;
            --ios-card: #1c1c1e;
            --ios-blue: #0a84ff;
            --ios-green: #30d158;
            --ios-red: #ff453a;
            --ios-text: #ffffff;
            --ios-subtext: #8e8e93;
            --ios-border: #2c2c2e;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", sans-serif;
            background-color: var(--ios-bg);
            color: var(--ios-text);
            margin: 0;
            padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom) 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* iOS Header */
        .ios-navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: rgba(28, 28, 30, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 0.5px solid var(--ios-border);
            z-index: 10;
        }

        .ios-title {
            font-size: 17px;
            font-weight: 600;
        }

        .ios-nav-btn {
            background: none;
            border: none;
            color: var(--ios-blue);
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            padding: 4px 8px;
        }

        /* Workspace & Canvas */
        .cropper-area {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            background: #050505;
            overflow: hidden;
        }

        #crop-canvas {
            max-width: 100%;
            max-height: 100%;
            touch-action: none;
        }

        .placeholder-box {
            text-align: center;
            padding: 24px;
        }

        .placeholder-icon {
            font-size: 64px;
            margin-bottom: 12px;
        }

        /* iOS Bottom Toolbar & Controls */
        .ios-toolbar {
            background: rgba(28, 28, 30, 0.9);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 0.5px solid var(--ios-border);
            padding: 12px 16px 24px 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .preset-pills {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 4px;
            -webkit-overflow-scrolling: touch;
        }

        .preset-pill {
            background: var(--ios-card);
            color: var(--ios-text);
            border: 1px solid var(--ios-border);
            padding: 8px 14px;
            border-radius: 16px;
            font-size: 13px;
            font-weight: 500;
            white-space: nowrap;
            cursor: pointer;
        }

        .preset-pill.active {
            background: var(--ios-blue);
            border-color: var(--ios-blue);
            font-weight: 600;
        }

        .action-row {
            display: flex;
            gap: 12px;
        }

        .btn-ios {
            flex: 1;
            background: var(--ios-blue);
            color: #ffffff;
            border: none;
            border-radius: 12px;
            padding: 14px;
            font-size: 16px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
        }

        .btn-ios.btn-secondary {
            background: var(--ios-card);
            color: var(--ios-text);
            border: 1px solid var(--ios-border);
        }

        .btn-ios.btn-success {
            background: var(--ios-green);
        }
    </style>
</head>
<body>

    <!-- iOS Navbar -->
    <div class="ios-navbar">
        <button class="ios-nav-btn" onclick="document.getElementById('file-input').click()">📷 Open</button>
        <div class="ios-title">PhotoCropper iOS</div>
        <button class="ios-nav-btn" onclick="saveCroppedPhoto()">💾 Save</button>
    </div>

    <!-- Canvas Crop Work Area -->
    <div class="cropper-area">
        <div id="placeholder" class="placeholder-box">
            <div class="placeholder-icon">📸</div>
            <p style="font-size: 17px; font-weight: 600; margin: 0 0 6px 0;">Select a Photo to Crop</p>
            <p style="font-size: 14px; color: var(--ios-subtext); margin: 0 0 16px 0;">Choose from iPhone Photos or Camera</p>
            <button class="btn-ios" onclick="document.getElementById('file-input').click()">Choose Photo</button>
        </div>
        <canvas id="crop-canvas" style="display: none;"></canvas>
        <input type="file" id="file-input" accept="image/*" style="display: none;" onchange="loadPhoto(event)">
    </div>

    <!-- iOS Toolbar -->
    <div class="ios-toolbar">
        <!-- Aspect Ratios -->
        <div class="preset-pills">
            <div class="preset-pill active" onclick="setAspect('free', this)">Free</div>
            <div class="preset-pill" onclick="setAspect('1:1', this)">1:1 Square</div>
            <div class="preset-pill" onclick="setAspect('4:3', this)">4:3 Photo</div>
            <div class="preset-pill" onclick="setAspect('16:9', this)">16:9 Landscape</div>
            <div class="preset-pill" onclick="setAspect('9:16', this)">9:16 Story</div>
            <div class="preset-pill" onclick="setAspect('4:5', this)">4:5 Instagram</div>
        </div>

        <!-- Action Row -->
        <div class="action-row">
            <button class="btn-ios btn-secondary" onclick="rotatePhoto()">🔄 Rotate</button>
            <button class="btn-ios btn-success" onclick="syncToDesktop()">📡 Sync Desktop</button>
        </div>
    </div>

    <script>
        let img = new Image();
        let canvas = document.getElementById('crop-canvas');
        let ctx = canvas.getContext('2d');
        let rotation = 0;
        let currentAspect = 'free';

        function loadPhoto(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                img.onload = function() {
                    document.getElementById('placeholder').style.display = 'none';
                    canvas.style.display = 'block';
                    rotation = 0;
                    renderCanvas();
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function renderCanvas() {
            if (!img.src) return;
            const is90 = (rotation / 90) % 2 !== 0;
            canvas.width = is90 ? img.height : img.width;
            canvas.height = is90 ? img.width : img.height;

            ctx.save();
            ctx.translate(canvas.width / 2, canvas.height / 2);
            ctx.rotate((rotation * Math.PI) / 180);
            ctx.drawImage(img, -img.width / 2, -img.height / 2);
            ctx.restore();
        }

        function rotatePhoto() {
            rotation = (rotation + 90) % 360;
            renderCanvas();
        }

        function setAspect(aspect, element) {
            document.querySelectorAll('.preset-pill').forEach(p => p.classList.remove('active'));
            element.classList.add('active');
            currentAspect = aspect;
        }

        function saveCroppedPhoto() {
            if (!img.src) return alert('Please load a photo first!');
            const link = document.createElement('a');
            link.download = 'cropped-photo-' + Date.now() + '.jpg';
            link.href = canvas.toDataURL('image/jpeg', 0.95);
            link.click();
        }

        function syncToDesktop() {
            if (!img.src) return alert('Please load a photo first!');
            const host = prompt('Enter your Desktop WebPhotoCropper IP:', 'http://192.168.1.5:59999');
            if (!host) return;

            const dataUrl = canvas.toDataURL('image/jpeg', 0.95);
            fetch(host.replace(/\/$/, '') + '/load', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ url: dataUrl })
            }).then(() => alert('Successfully synced photo to Desktop Cropper!'))
              .catch(err => alert('Sync failed: ' + err));
        }

        // Register Service Worker for PWA
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(() => {});
        }
    </script>
</body>
</html>
